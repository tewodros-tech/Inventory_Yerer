<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Church Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            background: #2c3e50;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #1a252f;
        }
        .main-content {
            padding: 30px;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            color: white;
        }
        .stat-card.blue {
            background: #3498db;
        }
        .stat-card.green {
            background: #2ecc71;
        }
        .stat-card.orange {
            background: #f39c12;
        }
        .stat-card.red {
            background: #e74c3c;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h4 class="text-white text-center mt-2 mb-4">⛪ Church System</h4>
                <a href="#" class="active">🏠 Dashboard</a>
                <a href="#" onclick="loadPage('members')">👥 Members</a>
                <a href="#" onclick="loadPage('inventory')">📦 Inventory</a>
                <a href="#" onclick="loadPage('tithes')">💰 Tithes</a>
                <a href="#" onclick="loadPage('departures')">🚪 Departures</a>
                <hr class="border-light" />
                <a href="#" onclick="loadPage('reports')">📊 Reports</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <h2 id="pageTitle">📊 Dashboard</h2>
                <div id="contentArea">
                    <!-- Dashboard Stats -->
                    <div class="row mt-4" id="dashboardStats">
                        <div class="col-md-3">
                            <div class="stat-card blue">
                                <div class="number" id="totalMembers">0</div>
                                <div class="label">Total Members</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card green">
                                <div class="number" id="totalTithes">$0</div>
                                <div class="label">Total Tithes</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card orange">
                                <div class="number" id="totalItems">0</div>
                                <div class="label">Inventory Items</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card red">
                                <div class="number" id="activeMembers">0</div>
                                <div class="label">Active Members</div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-6">
                            <div class="card p-3">
                                <h5>📋 Recent Members</h5>
                                <div id="recentMembers">Loading...</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card p-3">
                                <h5>📦 Recent Inventory</h5>
                                <div id="recentInventory">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ===== DATA =====
        let members = JSON.parse(localStorage.getItem('churchMembers')) || [];
        let inventory = JSON.parse(localStorage.getItem('churchInventory')) || [];
        let tithes = JSON.parse(localStorage.getItem('churchTithes')) || [];
        let departures = JSON.parse(localStorage.getItem('churchDepartures')) || [];

        // ===== SAVE DATA =====
        function saveData() {
            localStorage.setItem('churchMembers', JSON.stringify(members));
            localStorage.setItem('churchInventory', JSON.stringify(inventory));
            localStorage.setItem('churchTithes', JSON.stringify(tithes));
            localStorage.setItem('churchDepartures', JSON.stringify(departures));
            updateDashboard();
        }

        // ===== UPDATE DASHBOARD =====
        function updateDashboard() {
            document.getElementById('totalMembers').textContent = members.length;
            document.getElementById('activeMembers').textContent = members.filter(m => m.status === 'Active').length;
            document.getElementById('totalItems').textContent = inventory.length;
            
            let total = tithes.reduce((sum, t) => sum + t.amount, 0);
            document.getElementById('totalTithes').textContent = '$' + total.toLocaleString();

            // Recent Members
            let recent = members.slice(-5).reverse();
            let html = '<ul class="list-group">';
            recent.forEach(m => {
                html += `<li class="list-group-item">${m.name} - ${m.status || 'Active'} <small class="text-muted">(${m.registrationDate})</small></li>`;
            });
            if (recent.length === 0) html += '<li class="list-group-item text-muted">No members yet</li>';
            html += '</ul>';
            document.getElementById('recentMembers').innerHTML = html;

            // Recent Inventory
            let recentInv = inventory.slice(-5).reverse();
            html = '<ul class="list-group">';
            recentInv.forEach(item => {
                html += `<li class="list-group-item">${item.name} - ${item.quantity} ${item.unit || ''} <small class="text-muted">(${item.location})</small></li>`;
            });
            if (recentInv.length === 0) html += '<li class="list-group-item text-muted">No inventory items yet</li>';
            html += '</ul>';
            document.getElementById('recentInventory').innerHTML = html;
        }

        // ===== LOAD PAGES =====
        function loadPage(page) {
            const titles = {
                members: '👥 Members',
                inventory: '📦 Inventory',
                tithes: '💰 Tithes',
                departures: '🚪 Departures',
                reports: '📊 Reports'
            };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';

            let content = '';
            if (page === 'members') content = getMembersPage();
            else if (page === 'inventory') content = getInventoryPage();
            else if (page === 'tithes') content = getTithesPage();
            else if (page === 'departures') content = getDeparturesPage();
            else if (page === 'reports') content = getReportsPage();
            else content = getDashboardPage();

            document.getElementById('contentArea').innerHTML = content;

            // Highlight sidebar
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            const links = document.querySelectorAll('.sidebar a');
            const map = { members: 1, inventory: 2, tithes: 3, departures: 4, reports: 5 };
            if (map[page]) links[map[page]].classList.add('active');
        }

        // ===== GET DASHBOARD =====
        function getDashboardPage() {
            return `
                <div class="row mt-4">
                    <div class="col-md-3"><div class="stat-card blue"><div class="number">${members.length}</div><div class="label">Total Members</div></div></div>
                    <div class="col-md-3"><div class="stat-card green"><div class="number">$${tithes.reduce((s,t) => s + t.amount, 0).toLocaleString()}</div><div class="label">Total Tithes</div></div></div>
                    <div class="col-md-3"><div class="stat-card orange"><div class="number">${inventory.length}</div><div class="label">Inventory Items</div></div></div>
                    <div class="col-md-3"><div class="stat-card red"><div class="number">${members.filter(m => m.status === 'Active').length}</div><div class="label">Active Members</div></div></div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6"><div class="card p-3"><h5>📋 Recent Members</h5><div id="recentMembers">${getRecentMembers()}</div></div></div>
                    <div class="col-md-6"><div class="card p-3"><h5>📦 Recent Inventory</h5><div id="recentInventory">${getRecentInventory()}</div></div></div>
                </div>
            `;
        }

        function getRecentMembers() {
            let html = '<ul class="list-group">';
            members.slice(-5).reverse().forEach(m => {
                html += `<li class="list-group-item">${m.name} - ${m.status || 'Active'} <small class="text-muted">(${m.registrationDate})</small></li>`;
            });
            if (members.length === 0) html += '<li class="list-group-item text-muted">No members yet</li>';
            html += '</ul>';
            return html;
        }

        function getRecentInventory() {
            let html = '<ul class="list-group">';
            inventory.slice(-5).reverse().forEach(item => {
                html += `<li class="list-group-item">${item.name} - ${item.quantity} ${item.unit || ''} <small class="text-muted">(${item.location})</small></li>`;
            });
            if (inventory.length === 0) html += '<li class="list-group-item text-muted">No inventory items yet</li>';
            html += '</ul>';
            return html;
        }

        // ===== MEMBERS PAGE =====
        function getMembersPage() {
            let html = `
                <button class="btn btn-primary mb-3" onclick="showAddMember()">+ Add Member</button>
                <table class="table table-striped">
                    <thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Registration Date</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
            `;
            members.forEach((m, i) => {
                html += `<tr>
                    <td>${m.name}</td>
                    <td>${m.age || '-'}</td>
                    <td>${m.phone || '-'}</td>
                    <td>${m.registrationDate || '-'}</td>
                    <td><span class="badge bg-${m.status === 'Active' ? 'success' : m.status === 'Inactive' ? 'danger' : 'warning'}">${m.status || 'Active'}</span></td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteMember(${i})">✕</button></td>
                </tr>`;
            });
            if (members.length === 0) html += '<tr><td colspan="6" class="text-center text-muted">No members added yet</td></tr>';
            html += '</tbody></table>';
            return html;
        }

        // ===== ADD MEMBER =====
        function showAddMember() {
            const name = prompt('Enter Member Name:');
            if (!name) return;
            const age = prompt('Enter Age:');
            const phone = prompt('Enter Phone Number:');
            const status = confirm('Is this member Active? Click OK for Active, Cancel for Inactive');
            
            members.push({
                name: name,
                age: age || '',
                phone: phone || '',
                registrationDate: new Date().toISOString().split('T')[0],
                status: status ? 'Active' : 'Inactive'
            });
            saveData();
            loadPage('members');
        }

        function deleteMember(index) {
            if (confirm(`Delete ${members[index].name}?`)) {
                members.splice(index, 1);
                saveData();
                loadPage('members');
            }
        }

        // ===== INVENTORY PAGE =====
        function getInventoryPage() {
            let html = `
                <button class="btn btn-primary mb-3" onclick="showAddInventory()">+ Add Inventory Item</button>
                <table class="table table-striped">
                    <thead><tr><th>Item Name</th><th>Quantity</th><th>Unit</th><th>Location</th><th>Condition</th><th>Actions</th></tr></thead>
                    <tbody>
            `;
            inventory.forEach((item, i) => {
                html += `<tr>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.unit || '-'}</td>
                    <td>${item.location || '-'}</td>
                    <td>${item.condition || 'Good'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteInventory(${i})">✕</button></td>
                </tr>`;
            });
            if (inventory.length === 0) html += '<tr><td colspan="6" class="text-center text-muted">No inventory items yet</td></tr>';
            html += '</tbody></table>';
            return html;
        }

        function showAddInventory() {
            const name = prompt('Enter Item Name:');
            if (!name) return;
            const quantity = prompt('Enter Quantity:');
            const location = prompt('Enter Location (e.g., Main Hall, Storage):');
            
            inventory.push({
                name: name,
                quantity: parseInt(quantity) || 1,
                unit: 'Each',
                location: location || 'Unknown',
                condition: 'Good'
            });
            saveData();
            loadPage('inventory');
        }

        function deleteInventory(index) {
            if (confirm(`Delete ${inventory[index].name}?`)) {
                inventory.splice(index, 1);
                saveData();
                loadPage('inventory');
            }
        }

        // ===== TITHES PAGE =====
        function getTithesPage() {
            let html = `
                <button class="btn btn-primary mb-3" onclick="showAddTithe()">+ Add Tithe</button>
                <table class="table table-striped">
                    <thead><tr><th>Member</th><th>Amount</th><th>Payment Method</th><th>Date</th><th>Type</th><th>Actions</th></tr></thead>
                    <tbody>
            `;
            tithes.forEach((t, i) => {
                html += `<tr>
                    <td>${t.memberName || 'Unknown'}</td>
                    <td>$${t.amount}</td>
                    <td>${t.paymentMethod || 'Cash'}</td>
                    <td>${t.date || '-'}</td>
                    <td>${t.type || 'Regular Tithe'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteTithe(${i})">✕</button></td>
                </tr>`;
            });
            if (tithes.length === 0) html += '<tr><td colspan="6" class="text-center text-muted">No tithes recorded yet</td></tr>';
            html += '</tbody></table>';
            return html;
        }

        function showAddTithe() {
            const memberName = prompt('Enter Member Name:');
            if (!memberName) return;
            const amount = parseFloat(prompt('Enter Tithe Amount ($):'));
            if (isNaN(amount)) return;
            
            tithes.push({
                memberName: memberName,
                amount: amount,
                paymentMethod: 'Cash',
                date: new Date().toISOString().split('T')[0],
                type: 'Regular Tithe'
            });
            saveData();
            loadPage('tithes');
        }

        function deleteTithe(index) {
            if (confirm(`Delete tithe of $${tithes[index].amount}?`)) {
                tithes.splice(index, 1);
                saveData();
                loadPage('tithes');
            }
        }

        // ===== DEPARTURES PAGE =====
        function getDeparturesPage() {
            let html = `
                <button class="btn btn-primary mb-3" onclick="showAddDeparture()">+ Record Departure</button>
                <table class="table table-striped">
                    <thead><tr><th>Member</th><th>Departure Date</th><th>Reason</th><th>Can Return?</th><th>Actions</th></tr></thead>
                    <tbody>
            `;
            departures.forEach((d, i) => {
                html += `<tr>
                    <td>${d.memberName}</td>
                    <td>${d.departureDate}</td>
                    <td>${d.reason || '-'}</td>
                    <td>${d.canReturn ? '✅' : '❌'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteDeparture(${i})">✕</button></td>
                </tr>`;
            });
            if (departures.length === 0) html += '<tr><td colspan="5" class="text-center text-muted">No departures recorded yet</td></tr>';
            html += '</tbody></table>';
            return html;
        }

        function showAddDeparture() {
            const memberName = prompt('Enter Member Name:');
            if (!memberName) return;
            const reason = prompt('Enter Reason for Departure (e.g., Moving, Transfer):');
            
            departures.push({
                memberName: memberName,
                departureDate: new Date().toISOString().split('T')[0],
                reason: reason || 'Other',
                canReturn: confirm('Can this member return? Click OK for Yes, Cancel for No')
            });
            saveData();
            loadPage('departures');
        }

        function deleteDeparture(index) {
            if (confirm(`Delete departure record for ${departures[index].memberName}?`)) {
                departures.splice(index, 1);
                saveData();
                loadPage('departures');
            }
        }

        // ===== REPORTS PAGE =====
        function getReportsPage() {
            let totalTithes = tithes.reduce((s, t) => s + t.amount, 0);
            let active = members.filter(m => m.status === 'Active').length;
            let departed = departures.length;

            return `
                <div class="row mt-3">
                    <div class="col-md-4"><div class="card p-3"><h5>📊 Summary</h5>
                        <p><strong>Total Members:</strong> ${members.length}</p>
                        <p><strong>Active Members:</strong> ${active}</p>
                        <p><strong>Departed Members:</strong> ${departed}</p>
                        <p><strong>Total Tithes:</strong> $${totalTithes.toLocaleString()}</p>
                        <p><strong>Inventory Items:</strong> ${inventory.length}</p>
                    </div></div>
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5>📋 Member Status Breakdown</h5>
                            <ul class="list-group">
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    Active
                                    <span class="badge bg-success rounded-pill">${members.filter(m => m.status === 'Active').length}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    Inactive
                                    <span class="badge bg-danger rounded-pill">${members.filter(m => m.status === 'Inactive').length}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    On Leave
                                    <span class="badge bg-warning rounded-pill">${members.filter(m => m.status === 'On Leave').length}</span>
                                </li>
                            </ul>
                        </div>
                        <div class="card p-3 mt-3">
                            <h5>📋 Departure Reasons</h5>
                            <ul class="list-group">
                                ${departures.length === 0 ? '<li class="list-group-item text-muted">No departures recorded</li>' :
                                    departures.map(d => `<li class="list-group-item d-flex justify-content-between">${d.memberName} <span class="text-muted">${d.reason}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== INIT =====
        updateDashboard();
    </script>
</body>
</html>
